server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion. El bundle de una SPA se beneficia mucho.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los assets llevan hash en el nombre: se pueden cachear indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index.html nunca se cachea, o el navegador seguiria pidiendo el bundle antiguo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy hacia el backend. Evita CORS: el navegador solo ve este origen.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback de SPA: cualquier ruta desconocida la resuelve React Router,
    # no nginx. Sin esto, recargar en /calendario devolveria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
