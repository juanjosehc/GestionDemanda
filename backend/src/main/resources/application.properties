spring.application.name=gestion-demanda-backend

# Carga opcional del archivo .env (formato properties) ubicado en backend/ o en la raiz.
# Permite configurar el entorno sin exportar variables a mano. Ver .env.example.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Integracion GLPI
# GLPI_URL debe incluir el sufijo /apirest.php
# ---------------------------------------------------------------------------
glpi.base-url=${GLPI_URL:}
glpi.app-token=${GLPI_APP_TOKEN:}
glpi.user-token=${GLPI_USER_TOKEN:}
glpi.timeout=${GLPI_TIMEOUT:5s}

# ---------------------------------------------------------------------------
# Confianza TLS hacia GLPI
#
# El servidor de GLPI no envia su certificado intermedio, y la JVM no lo
# descarga por su cuenta —Windows si, y por eso el mismo host responde desde el
# navegador y falla desde la aplicacion—. Sin ese eslabon la cadena no se puede
# construir y la conexion muere con SunCertPathBuilderException antes de llegar
# a la API.
#
# El archivo declara el intermedio que falta y la raiz que lo firma. Sustituye
# al almacen por defecto SOLO para el cliente de GLPI: cualquier otro destino
# sigue confiando en los certificados de siempre. El conjunto resultante es mas
# estrecho que el almacen por defecto, no mas amplio —solo acepta lo que firme
# esa CA—, asi que esto no relaja la verificacion: la completa.
#
# Si GLPI cambia de emisor hay que reemplazar el archivo. El sintoma es un fallo
# de handshake al planificar, y el emisor esperado aparece en el propio error.
# ---------------------------------------------------------------------------
spring.ssl.bundle.pem.glpi.truststore.certificate=classpath:glpi/glpi-truststore.pem

# ---------------------------------------------------------------------------
# Persistencia
#
# PostgreSQL es el unico motor, en todos los entornos. Para levantar uno local:
#
#   docker compose up -d postgres
#
# Los valores por defecto coinciden con los del servicio de docker-compose.yml, de
# modo que la aplicacion arranca contra el sin configurar nada.
#
# A diferencia de GLPI, la base de datos no es opcional: sin ella no hay donde
# guardar el plan ni el registro de idempotencia, asi que la aplicacion no
# arranca. Es el cambio de contrato de esta fase.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME:gestiondemanda}}
spring.datasource.username=${DB_USER:gestiondemanda}
spring.datasource.password=${DB_PASSWORD:gestiondemanda}

# El esquema lo mantiene Hibernate desde las entidades. Es suficiente mientras el
# modelo siga moviendose y no haya datos que conservar entre versiones; en cuanto
# los haya, el sitio es una herramienta de migraciones (Flyway) y esta linea pasa
# a "validate". Ver el riesgo 33.
spring.jpa.hibernate.ddl-auto=update
# Sin sesion abierta durante la serializacion: las consultas se hacen en el
# adaptador y la respuesta se arma con objetos de dominio ya cargados.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Reglas de planificacion
#
# Las consume PlanningProperties, que las traduce al objeto de dominio
# PlanningRules. Todos los valores tienen valor por defecto: la aplicacion
# arranca sin configuracion adicional.
# ---------------------------------------------------------------------------
# Dedicacion, en horas, a partir de la cual un incidente obliga a recalcular el
# plan. Se supera en sentido estricto: exactamente el umbral no dispara nada.
# Solo gobierna a los incidentes SIN severidad (dato legado): los que declaran
# severidad se rigen por su politica. Queda sin efecto cuando GLPI envie prioridad.
planning.incident-threshold-hours=${PLANNING_INCIDENT_THRESHOLD_HOURS:4}
# Jornada estandar de un desarrollador. Es la duracion del bloque de calendario
# cuando no se declara planning.calendar.end-time; si se declara, manda el bloque.
planning.working-hours-per-day=${PLANNING_WORKING_HOURS_PER_DAY:8}
# Cuantos dias hacia adelante se busca hueco antes de declarar falta de capacidad.
planning.planning-horizon-days=${PLANNING_HORIZON_DAYS:10}

# ---------------------------------------------------------------------------
# Calendario laboral
#
# Responde a "cuando hay alguien trabajando". El motor calcula la capacidad de
# cada fecha preguntando aqui: sabados, domingos y festivos devuelven cero horas,
# y el plan salta al siguiente dia laborable sin que el motor lo sepa.
#
# Los objetivos de la OLA tambien se miden aqui: cuatro horas pedidas un viernes a
# las 16:30 vencen el lunes a las 12:30, no el viernes a las 20:30.
# ---------------------------------------------------------------------------
# Apertura de la jornada.
planning.calendar.start-time=${PLANNING_CALENDAR_START_TIME:09:00}
# Cierre de la jornada. Si se omite, cierra a la apertura mas la jornada declarada
# arriba. Declararlo tiene prioridad sobre ella: 09:00-17:00 son ocho horas de trabajo.
# planning.calendar.end-time=${PLANNING_CALENDAR_END_TIME:17:00}
# Dias de la semana que nunca son laborables.
planning.calendar.weekend=${PLANNING_CALENDAR_WEEKEND:SATURDAY,SUNDAY}
# Festivos, en formato ISO y separados por coma. Sin declarar no hay ninguno.
# planning.calendar.holidays=2026-01-01,2026-04-02,2026-05-01,2026-12-25

# ---------------------------------------------------------------------------
# Acuerdo de nivel operativo (OLA) por severidad
#
# Cada severidad declara su objetivo de adquisicion, su objetivo de resolucion y
# el comportamiento de planificacion que el motor le aplica:
#
#   INMEDIATA      reclama la jornada completa del dia en que se reporta
#   POR_CAPACIDAD  compite por capacidad y desborda a los dias siguientes
#   POR_SATURACION convive: solo reclama si no cabe ni en una jornada completa
#
# Los valores por defecto viven en el dominio (IncidentPolicy.defaults); aqui se
# declaran para dejarlos editables. Ajustar la OLA no exige tocar codigo: cambiar
# un comportamiento y reiniciar basta. Un campo omitido conserva su valor por
# defecto, de modo que una declaracion parcial es valida.
# ---------------------------------------------------------------------------
planning.incident-policies.ALTO.target-ownership-minutes=${OLA_ALTO_ADQUISICION_MINUTOS:15}
planning.incident-policies.ALTO.target-resolution-hours=${OLA_ALTO_RESOLUCION_HORAS:4}
planning.incident-policies.ALTO.displacement-policy=INMEDIATA

planning.incident-policies.MEDIO.target-ownership-minutes=${OLA_MEDIO_ADQUISICION_MINUTOS:15}
planning.incident-policies.MEDIO.target-resolution-hours=${OLA_MEDIO_RESOLUCION_HORAS:8}
planning.incident-policies.MEDIO.displacement-policy=POR_CAPACIDAD

planning.incident-policies.BAJO.target-ownership-minutes=${OLA_BAJO_ADQUISICION_MINUTOS:15}
planning.incident-policies.BAJO.target-resolution-hours=${OLA_BAJO_RESOLUCION_HORAS:12}
planning.incident-policies.BAJO.displacement-policy=POR_SATURACION

# ---------------------------------------------------------------------------
# Equipo
#
# Responde a "quienes son". El padron se arma con el grupo declarado aqui y
# despues con las excepciones de mas abajo, en ese orden y por ese motivo: GLPI
# es la fuente principal y una excepcion solo la complementa.
#
# El grupo se lee CON sus subgrupos. En esta instancia el 1 es "Desarrollo N2",
# cuarenta y una personas entre el grupo y los suyos; solo la pertenencia directa
# devolveria veintiuna.
#
# Que el grupo no se pueda leer no rompe la pantalla del equipo: el catalogo se
# devuelve con las excepciones y declara el fallo. Lo que hay que tener presente
# es lo que eso significa —en ese estado la lista son solo las personas
# declaradas a mano— y que puede faltar gente sin que nada lo delate: un usuario
# que la cuenta de integracion no puede ver no aparece ni en la lista ni en el
# total, asi que no hay forma de detectar la ausencia desde aqui.
# ---------------------------------------------------------------------------
team.group-id=${TEAM_GROUP_ID:1}
team.group-name=${TEAM_GROUP_NAME:Desarrollo N2}

# Excepciones: personas que el catalogo tiene que enseñar aunque GLPI no las
# entregue. Cubren tres casos, y solo tres:
#
#   - GLPI no las tiene en el grupo y deberia (la pertenencia esta mal alla)
#   - GLPI no las puede leer (permiso de la cuenta de integracion)
#   - no estan en GLPI (alguien del equipo sin cuenta, sin glpi-id)
#
# Una excepcion añade o marca; nunca borra. Si GLPI dice que alguien esta en el
# equipo, el padron no lo puede contradecir. Y si el login ya vino del grupo, la
# excepcion no se aplica y el catalogo lo publica en "unusedExceptions": una
# decision sin efecto hay que verla, no descubrirla leyendo el archivo.
#
# Los corchetes son para conservar las mayusculas del login, y hay que
# conservarlas: ese texto es el identificador con el que se piden los tickets, la
# declaracion y el plan. El mismo login en minusculas seria otra persona.
#
# "active=false" retira a alguien sin borrar la fila; sin declararlo, la persona
# cuenta como vigente.
#
# El caso que motivo que esto exista —Nicolas Alejandro Suarez Florez, login
# NicoSuar, id 1071 en GLPI: existe y esta activo, pero su grupo esta vacio, asi
# que no aparece en ninguna lectura por grupo—. La marca de equipo operativo de
# mas abajo lo incluye entre las dieciocho personas con las que se trabaja a
# diario, y una marca sobre alguien que no esta en el padron no hace nada: por eso
# la excepcion esta declarada y no comentada. Que este en Desarrollo N2 lo decidio
# el area; esto lo deja escrito.

team.exceptions[NicoSuar].name=Nicolas Alejandro Suarez Florez
team.exceptions[NicoSuar].glpi-id=1071

# ---------------------------------------------------------------------------
# Equipo operativo: quien se enseña por defecto en la pantalla del equipo.
#
# La gestion diaria de la demanda se hace con un subconjunto de Desarrollo N2, y
# el resto ocupa la tabla sin aportar. Esto lo declara. **No es un padron**: GLPI
# sigue enumerando a todo el mundo, el catalogo los sigue publicando a todos, y
# nadie desaparece de /api/team por no estar aqui. Lo unico que cambia es con
# quien abre la pantalla, y el conmutador de la vista enseña al resto a un clic.
#
#   true    esta en el equipo operativo: se ve por defecto
#   false   se dejo fuera a proposito, y queda escrito que fue una decision
#   ausente no pertenece — es el caso de todo el que no este en esta lista
#
# Que un login ausente NO pertenezca es deliberado. Lo contrario —todo el mundo
# dentro salvo lo que alguien se acuerde de sacar— convertiria esta lista en un
# residuo del directorio: cualquiera que GLPI diera de alta entraria al equipo
# operativo sin que nadie lo hubiera decidido. El precio es el simetrico, y hay
# que tenerlo presente: **una persona nueva en Desarrollo N2 no aparece en la
# vista por defecto hasta que se la escriba aqui**. Se ve en "Mostrar todos", que
# es para lo que esta el conmutador.
#
# Los corchetes conservan las mayusculas del login, igual que arriba, y hay que
# conservarlas: la marca se busca por el login exacto. Una errata no se aplica y
# no se calla —el catalogo publica en "unusedOperational" las marcas que no
# corresponden a nadie del padron, y la pantalla las enseña—. Es la unica defensa
# contra un login mal escrito, que si no dejaria a alguien fuera en silencio.
#
# Cambiar quien es operativo es editar aqui y reiniciar. No hay boton que lo haga
# desde la pantalla, y es a proposito: persistirlo exigiria una tabla y una
# segunda fuente de verdad sobre las personas, que es justo lo que este diseno
# evita (decision 168).
#
# Las dieciocho con las que se trabaja a diario hoy:
team.operational[AbraAran]=true
team.operational[AlejPine]=true
team.operational[AnalRuiz]=true
team.operational[AndrEsco]=true
team.operational[AndrGonza]=true
team.operational[AndrBelt]=true
team.operational[CesaGira]=true
team.operational[DaniLope]=true
team.operational[FranZulu]=true
team.operational[JhonAteh]=true
team.operational[JoseDiaz]=true
team.operational[JoseGonz]=true
team.operational[JoseGarc]=true
team.operational[MaurMarm]=true
team.operational[NicoSuar]=true
team.operational[NilsCort]=true
team.operational[SilvCast]=true
team.operational[StelMedi]=true

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.co.com.coltefinanciera.gestiondemanda=INFO
