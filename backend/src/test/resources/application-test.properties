# Perfil de pruebas.
#
# La suite corre contra H2 en memoria, no contra PostgreSQL. Es una desviacion deliberada y con
# motivo: las pruebas tienen que pasar sin Docker levantado, y exigir un motor real convertiria
# "mvn test" en un comando que depende del entorno de quien lo ejecuta. El esquema lo genera
# Hibernate desde las mismas entidades que usa PostgreSQL, y el modo PostgreSQL acerca el dialecto,
# pero no es el motor real: lo que H2 no puede comprobar son sus particularidades (tipos, indices,
# concurrencia). Cuando eso importe, la via es Testcontainers. Ver la decision 49 y el riesgo 34.
spring.datasource.url=jdbc:h2:mem:gestiondemanda;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# El esquema se crea y se tira con cada contexto: una prueba no debe heredar filas de otra.
spring.jpa.hibernate.ddl-auto=create-drop
